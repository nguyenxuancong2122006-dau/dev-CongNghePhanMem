<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Cong Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .login-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.2);

        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1e3a8a;

            margin-bottom: 10px;

        }


        .title {

            text-align: center;

            color: #555;

            margin-bottom: 25px;

        }


        .message {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            text-align: center;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37,99,235,0.1);

        }


        .login-button {

            width: 100%;

            padding: 13px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-button:hover {

            background: #1e40af;

        }


        .register {

            text-align: center;

            margin-top: 20px;

            color: #666;

        }


        .register a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

        }


        .register a:hover {

            text-decoration: underline;

        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #666;

            text-decoration: none;

        }


        .back-home:hover {

            color: #2563eb;

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">

        🛒 Cong Store

    </div>


    <p class="title">

        Đăng nhập vào tài khoản

    </p>


    <!-- HIỂN THỊ THÔNG BÁO -->

    {% if messages %}

        {% for message in messages %}

            <div class="message">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <!-- FORM ĐĂNG NHẬP -->

    <form method="POST">

        {% csrf_token %}


        <label>

            Email

        </label>


        <input
            type="email"
            name="email"
            placeholder="Nhập email"
            required
        >


        <label>

            Mật khẩu

        </label>


        <input
            type="password"
            name="password"
            placeholder="Nhập mật khẩu"
            required
        >


        <button
            type="submit"
            class="login-button"
        >

            🔐 Đăng nhập

        </button>

    </form>


    <!-- ĐĂNG KÝ -->

    <div class="register">

        Chưa có tài khoản?

        <a href="{% url 'register' %}">

            Đăng ký ngay

        </a>

    </div>


    <!-- VỀ TRANG CHỦ -->

    <a
        href="{% url 'home' %}"
        class="back-home"
    >

        ← Quay lại trang chủ

    </a>


</div>


</body>

</html>
